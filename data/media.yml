# Media page content. Every section is optional except `substack`.
# Entries marked `sample: true` show a yellow "Sample" badge — replace or delete them.

substack:
  url: https://christianwaugh.substack.com
  title: Vita Bona Science
  description: Dr. Waugh's Substack on the science of positive emotions, stress, and resilience, written for a general audience.

# Featured writing (Substack posts, essays, books), newest first.
