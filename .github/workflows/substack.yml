name: Update Substack posts

# Refreshes data/substack.json (latest posts shown on media.html) once a day.
on:
  schedule:
    - cron: "17 11 * * *"   # daily, 11:17 UTC
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update_substack.py
      - name: Commit if there are new posts
        run: |
          if git diff --quiet -- data/substack.json; then
            echo "No new posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/substack.json
          git commit -m "Update latest Substack posts"
          git push
